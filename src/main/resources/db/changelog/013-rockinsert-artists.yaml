databaseChangeLog:
  - changeSet:
      id: ROCKINSERT-artistas
      author: edu
      changes:
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Deftones' } }, { column: { name: bio, value: 'Deftones e uma banda de rock e metal alternativo conhecida por atmosferas densas, peso, melodia e uma identidade sonora muito influente.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'The Cure' } }, { column: { name: bio, value: 'The Cure e uma banda britanica essencial do rock alternativo, conhecida por sonoridade melancolica, estetica gotica e grande influencia cultural.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'KISS' } }, { column: { name: bio, value: 'KISS e uma banda de hard rock famosa por shows teatrais, maquiagem iconica, hinos de arena e forte impacto na cultura do rock.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Motley Crue' } }, { column: { name: bio, value: 'Motley Crue e uma banda de glam metal conhecida por energia excessiva, atitude rebelde e grande presenca no rock dos anos 80.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'David Bowie' } }, { column: { name: bio, value: 'David Bowie foi um artista essencial do rock e pop, conhecido por reinvencao artistica, personagens marcantes e influencia musical profunda.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: "Guns N' Roses" } }, { column: { name: bio, value: "Guns N' Roses e uma banda de hard rock conhecida por riffs marcantes, vocal explosivo e albuns que definiram o rock no fim dos anos 80." } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Metallica' } }, { column: { name: bio, value: 'Metallica e uma das maiores bandas de metal da historia, conhecida por riffs pesados, velocidade, tecnica e impacto global duradouro.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Fleetwood Mac' } }, { column: { name: bio, value: 'Fleetwood Mac e uma banda classica de rock conhecida por harmonias, composicoes emotivas e albuns fundamentais da musica popular.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'The Beatles' } }, { column: { name: bio, value: 'The Beatles e uma das bandas mais importantes da historia, revolucionando composicao, gravacao e a cultura pop mundial.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Pearl Jam' } }, { column: { name: bio, value: 'Pearl Jam e uma banda central do grunge e rock alternativo, conhecida por letras intensas, shows fortes e longevidade artistica.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Queen' } }, { column: { name: bio, value: 'Queen e uma banda britanica lendaria, conhecida por teatralidade, vocais poderosos, experimentacao e hinos que atravessam geracoes.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Linkin Park' } }, { column: { name: bio, value: 'Linkin Park e uma banda de nu metal e rock alternativo que marcou os anos 2000 com fusao de peso, rap, eletronica e emocao.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }


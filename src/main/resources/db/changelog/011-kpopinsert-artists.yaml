  - changeSet:
      id: KPOPINSERT-artistas-generos
      author: edu
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO tb_raven_genero_artist (artist_id, genero_id)
              SELECT a.id, g.id FROM tb_raven_artists a, tb_raven_genero g
              WHERE a.name IN ('CORTIS', 'BTS', 'Stray Kids', 'IVE', 'ITZY', 'KISS OF LIFE', 'Girls'' Generation', 'Wonder Girls', 'LISA', 'ROSE', 'JISOO', 'XG', 'i-dle', 'Red Velvet', 'Mamamoo')
                AND g.nome = 'K-Pop';

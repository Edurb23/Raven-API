databaseChangeLog:
  - changeSet:
      id: POPINSERT-artistas
      author: edu
      changes:
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Billie Eilish' } }, { column: { name: bio, value: 'Billie Eilish e uma artista pop conhecida por voz intimista, estetica sombria e uma escrita emocional que redefiniu o pop contemporaneo.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Taylor Swift' } }, { column: { name: bio, value: 'Taylor Swift e uma das maiores artistas pop da historia, conhecida por composicoes narrativas, reinvencoes musicais e impacto cultural global.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Olivia Rodrigo' } }, { column: { name: bio, value: 'Olivia Rodrigo e uma cantora e compositora pop-rock conhecida por letras confessionais, melodias fortes e grande impacto entre o publico jovem.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Madonna' } }, { column: { name: bio, value: 'Madonna e uma das figuras mais influentes do pop, reconhecida por reinvencao constante, performances iconicas e impacto duradouro na cultura musical.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Addison Rae' } }, { column: { name: bio, value: 'Addison Rae e uma artista pop que levou sua presenca digital para a musica, explorando sonoridades dance e estetica pop moderna.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Sabrina Carpenter' } }, { column: { name: bio, value: 'Sabrina Carpenter e uma cantora e atriz pop conhecida por carisma, letras afiadas e melodias leves que ganharam destaque internacional.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Rihanna' } }, { column: { name: bio, value: 'Rihanna e uma artista global que mistura pop, R&B, dancehall e hip-hop, construindo uma carreira marcada por hits e forte influencia cultural.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Justin Bieber' } }, { column: { name: bio, value: 'Justin Bieber e um cantor pop canadense que cresceu de fenomeno teen para artista global, unindo pop, R&B e dance em grandes sucessos.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Doja Cat' } }, { column: { name: bio, value: 'Doja Cat e uma artista pop e rap conhecida por versatilidade, humor visual, flows criativos e hits que transitam entre internet e radio.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Adele' } }, { column: { name: bio, value: 'Adele e uma cantora britanica reconhecida por voz poderosa, baladas emocionais e albuns que se tornaram marcos do pop contemporaneo.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Mariah Carey' } }, { column: { name: bio, value: 'Mariah Carey e uma das maiores vozes do pop e R&B, famosa por alcance vocal, composicoes marcantes e classicos que atravessam geracoes.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }
        - insert: { tableName: tb_raven_artists, columns: [ { column: { name: id, valueComputed: UUID() } }, { column: { name: name, value: 'Michael Jackson' } }, { column: { name: bio, value: 'Michael Jackson e conhecido como o Rei do Pop, com impacto imenso em danca, videoclipes, performance e na historia da musica popular.' } }, { column: { name: created_at, value: '2025-01-01 00:00:00' } }, { column: { name: update_at, value: '2025-01-01 00:00:00' } } ] }

